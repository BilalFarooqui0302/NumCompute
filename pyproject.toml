[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "numcompute-stream"
version = "0.2.0"
description = "NumCompute streaming decision-tree learning framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["numcompute*", "numcompute_stream*"]
